name: 일일 제재정보 스크래핑 & 이메일 발송

on:
  schedule:
    # 매일 1회 KST 07:00 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch:
    # 수동 실행 버튼 (테스트용)

# 동시 실행 방지: 이전 실행이 끝날 때까지 새 실행은 대기
concurrency:
  group: scrape-daily
  cancel-in-progress: false

jobs:
  scrape-and-email:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 스크래퍼 실행
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          TZ: Asia/Seoul
        run: python main.py

      - name: 수집 상태 저장 (state.json)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: update scrape state [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push 실패, 재시도 $i/5"
            sleep 5
          done
          echo "::error::state.json push가 5회 재시도 후에도 실패했습니다 — 다음 실행이 중복 발송할 수 있습니다."
          exit 1

      - name: 실행 결과 업로드 (디버깅용)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-logs-${{ github.run_id }}
          retention-days: 7
          path: "*.log"
